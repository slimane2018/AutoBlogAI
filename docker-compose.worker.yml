version: '3.8'

services:
  redis:
    image: redis:7
    ports:
      - '6379:6379'

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: autoblog
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/autoblog
      - OPENAI_API_KEY
      - WP_ENCRYPTION_KEY
      - NEXTAUTH_SECRET
    depends_on:
      - redis
      - postgres

volumes:
  pgdata:
